<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- `maximum-scale=1.0, user-scalable=no` was here and is deliberately gone.
       It disabled pinch-zoom, which is a WCAG 2.1 AA failure (1.4.4 Resize
       Text) in an app docs/compliance/privacy-and-data.md holds to AA. iOS has
       ignored the directive since iOS 10 anyway; Android obeyed it, so the only
       people it ever affected were the ones who needed to zoom. The reason it
       usually gets added — iOS zooming the page when you focus a small input —
       is already handled properly below by `input { font-size: 16px }`. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sabha Ride Seva</title>
  <!-- Kept in step with the theme by applyTheme() in src/utils/theme.ts. -->
  <meta name="theme-color" content="#FAF9F6" />

  <script>
    // Runs BEFORE first paint, on purpose, and inline, on purpose.
    //
    // The theme preference lives in localStorage, which React cannot read
    // until its bundle has downloaded, parsed and mounted. Anything applied
    // after that runs after the browser has already painted the default — so
    // a dark-theme user gets a full white flash on every single launch. An
    // external <script src> would not fix it either: that is one more network
    // round trip before the same paint.
    //
    // This deliberately duplicates three constants from src/utils/theme.ts
    // instead of importing them. It cannot import — it has to run before the
    // module graph exists. tests/utils/theme.test.ts asserts the two copies
    // still agree, so the duplication cannot rot unnoticed.
    (function () {
      try {
        var stored = localStorage.getItem('sabha-theme');
        var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'light';
        var resolved = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#1C1815' : '#FAF9F6');
      } catch (e) {
        // localStorage throws outright in a sandboxed iframe and in Lockdown
        // Mode. Light is the default regardless, so there is nothing to
        // recover — just make sure the attribute is always present.
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sabha Ride" />
  <!-- 180x180 is the size iOS actually asks for, and it must be FULL BLEED and
       opaque: iOS applies its own corner mask, so any margin baked into the
       file shows up as a border on the home screen. The old file had a 77px
       light surround of its own (12% of a 640px canvas) and rounded corners
       inside that, which is exactly what was showing. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <!-- Tailwind theme now lives in tailwind.config.js and is compiled at build time. -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }

    /* CRITICAL: just enough of the theme to paint the first frame.
       The full token set is in theme.css, which arrives with the JS bundle —
       one network round trip later. Without these four lines the pre-paint
       script above would correctly set data-theme="dark" and the page would
       still paint cream until that stylesheet landed, which is the very
       flash the script exists to prevent. theme.css then overrides both.
       Keep the values here identical to --canvas / --text-strong there;
       tests/utils/theme.test.ts checks that they match. */
    :root,
    :root[data-theme='light'] {
      --canvas: 250 249 246;
      --text-strong: 61 41 20;
      color-scheme: light;
    }

    :root[data-theme='dark'] {
      --canvas: 28 24 21;
      --text-strong: 232 227 220;
      color-scheme: dark;
    }

    body {
      background-color: rgb(var(--canvas, 250 249 246));
      color: rgb(var(--text-strong, 61 41 20));
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      width: 100%;
    }

    h1,
    h2,
    h3,
    h4 {
      text-wrap: balance;
    }

    .pb-safe {
      padding-bottom: var(--sab);
    }

    .pt-safe {
      padding-top: var(--sat);
    }

    /* Prevent iOS Zoom on focus for inputs with font-size < 16px */
    input,
    select,
    textarea {
      font-size: 16px !important;
    }

    .rangoli-border {
      position: relative;
    }

    .rangoli-border::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 10%;
      right: 10%;
      height: 4px;
      background-image: radial-gradient(rgb(var(--gold, 212 175 55)) 1px, transparent 1.5px);
      background-size: 8px 8px;
      opacity: 0.4;
    }

    .gold-shimmer {
      background: linear-gradient(135deg, rgb(var(--gold, 212 175 55)) 0%, #FFD700 50%, rgb(var(--gold, 212 175 55)) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-feedback:active {
      transform: scale(0.96);
      transition: transform 0.1s ease;
    }

    .success-draw {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.6s ease-out forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Scrollbar refinements */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgb(var(--gold, 212 175 55) / 0.27);
      border-radius: 10px;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.8.0/",
    "@firebase/app": "https://esm.sh/@firebase/app@^0.14.7",
    "@firebase/auth": "https://esm.sh/@firebase/auth@^1.12.0",
    "@firebase/firestore": "https://esm.sh/@firebase/firestore@^4.10.0"
  }
}
</script>
  <!-- index.css is imported from index.tsx; a second <link> here loaded it twice. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
